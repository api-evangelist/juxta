aid: juxta
name: Juxta
description: 'Juxta is a San Francisco positioning-technology company building a hardware-free
  Universal Positioning System (UPS) that delivers real-time indoor and outdoor tracking
  for people, assets, and robots with sub-meter accuracy indoors and roughly 3-meter
  accuracy outdoors. Rather than relying on satellites, beacons, or cameras, Juxta uses
  the inertial (IMU) sensors already present in mobile devices, robots, and machinery
  combined with machine-learning "synthetic fingerprinting" to map and track subjects
  in GPS-denied environments such as warehouses, hospitals, underground facilities, and
  battlefields. Its drag-and-drop deployment ingests a floorplan, satellite image, or
  CAD file and goes live in hours, priced by mapped area and assets tracked. Juxta serves
  defense, logistics and robotics, and healthcare, and is backed by Y Combinator and
  other early-stage investors. Access today is through a partner portal and booked demo;
  no public developer API is documented.'
